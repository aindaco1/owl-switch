name: Hardware validation report
description: Report whether OwlSwitch works on your Apple Silicon Mac and display setup
title: "[Hardware]: "
labels: ["hardware-validation"]
body:
  - type: markdown
    attributes:
      value: |
        Validation reports across Apple Silicon Macs and controller/playback display arrangements are extremely useful. Thank you for sharing yours!
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
    validations:
      required: true
  - type: dropdown
    id: display
    attributes:
      label: Display & output
      options:
        - One display
        - Two displays
        - Three or more displays
        - Other
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version
      description: Your macOS version, for example macOS 26.3
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options:
        - Works great
        - Works with issues
        - Doesn't work
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What worked / what didn't
      description: Playback, navigation, display routing, layout, audio, startup behavior, and anything you had to adjust.
    validations:
      required: true
  - type: textarea
    id: photos
    attributes:
      label: Photos of the setup (optional)
      description: Drag and drop photos of your setup or screen here — it is always fun to see OwlSwitch running in the wild.
