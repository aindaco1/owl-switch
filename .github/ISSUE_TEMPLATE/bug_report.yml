name: Bug report
description: Report something broken in OwlSwitch
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Most issues here are environment-specific, so the more detail on your hardware and setup, the faster it can be sorted out.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I checked the [documentation](https://github.com/aindaco1/owl-switch#readme) and existing [issues](https://github.com/aindaco1/owl-switch/issues) and didn't find this.
          required: true
  - type: dropdown
    id: module
    attributes:
      label: Area / module
      description: Which part of OwlSwitch does this affect?
      options:
        - Jellyfin module
        - Karaoke module
        - Retro module
        - Tumblr module
        - Nature module
        - Local module
        - App shell (browsing, settings, navigation)
        - Build (compiling from source)
        - Install / update (DMG)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
    validations:
      required: true
  - type: dropdown
    id: display
    attributes:
      label: Display & output
      description: Display routing and resolution details help diagnose controller and playback issues.
      options:
        - One display
        - Two displays
        - Three or more displays
        - Other
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Install method
      options:
        - macOS DMG
        - Built from source
    validations:
      required: true
  - type: input
    id: mpv_version
    attributes:
      label: mpv version
      description: First line of `mpv --version`. Playback issues often trace back to this.
      placeholder: "mpv 0.xx.0"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, step by step?
      placeholder: |
        1. Open a module
        2. Select an item
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / terminal output
      description: Any output from running the app. This is rendered as code, so no backticks needed.
      render: shell
